<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>强势集团何总爱上羽毛球场的我 - 短剧宣传海报</title>
    <script src="libs/tailwindcss.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .poster-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
        }
        
        .poster {
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 50%, #1a1a2e 100%);
            position: relative;
            overflow: hidden;
            border-radius: 0;
            min-height: 100vh;
        }
        
        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }
        
        .title-section {
            position: relative;
            z-index: 10;
            padding: 2rem 1.5rem 1rem;
            text-align: center;
        }
        
        .main-title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.5);
            letter-spacing: 0.05em;
            line-height: 1.3;
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.3));
            }
            to {
                filter: drop-shadow(0 0 40px rgba(255, 107, 157, 0.6));
            }
        }
        
        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #a0a0a0;
            margin-top: 0.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        
        .characters-section {
            position: relative;
            z-index: 10;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .character-card {
            position: relative;
            width: clamp(200px, 40vw, 300px);
            aspect-ratio: 3/4;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 107, 157, 0.2);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .character-card:hover {
            transform: translateY(-10px) scale(1.02);
        }
        
        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .character-card:hover .character-image {
            transform: scale(1.1);
        }
        
        .character-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
        }
        
        .character-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.25rem;
        }
        
        .character-role {
            font-size: 0.9rem;
            color: #ff6b9d;
            font-weight: 500;
        }
        
        .male-character .character-role {
            color: #00d4ff;
        }
        
        .vs-symbol {
            font-size: 2rem;
            font-weight: 900;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.8);
            z-index: 20;
        }
        
        .badges-section {
            position: relative;
            z-index: 10;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(255, 107, 157, 0.1));
            border: 1px solid rgba(255, 107, 157, 0.4);
            color: #ff6b9d;
            backdrop-filter: blur(10px);
        }
        
        .badge-blue {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #00d4ff;
        }
        
        .synopsis-section {
            position: relative;
            z-index: 10;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.8), rgba(26, 26, 46, 0.6));
            backdrop-filter: blur(10px);
            margin: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .synopsis-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .synopsis-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #c0c0c0;
        }
        
        .cta-section {
            position: relative;
            z-index: 10;
            padding: 1.5rem;
            text-align: center;
        }
        
        .watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255, 107, 157, 0.4);
            transition: all 0.3s ease;
        }
        
        .watch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(255, 107, 157, 0.6);
        }
        
        .shuttlecock {
            position: absolute;
            width: 60px;
            height: 60px;
            opacity: 0.15;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .shuttlecock-1 {
            top: 10%;
            right: 5%;
            animation-delay: 0s;
        }
        
        .shuttlecock-2 {
            top: 60%;
            left: 3%;
            animation-delay: 2s;
        }
        
        .shuttlecock-3 {
            bottom: 15%;
            right: 8%;
            animation-delay: 4s;
        }
        
        .footer {
            position: relative;
            z-index: 10;
            padding: 1.5rem;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="poster">
            <div class="grain-overlay"></div>
            
            <!-- 装饰性羽毛球 -->
            <svg class="shuttlecock shuttlecock-1" viewBox="0 0 100 100">
                <g fill="none" stroke="#ff6b9d" stroke-width="2">
                    <circle cx="50" cy="50" r="30"/>
                    <path d="M50 20 L50 80"/>
                    <path d="M20 50 L80 50"/>
                    <path d="M29 29 L71 71"/>
                    <path d="M71 29 L29 71"/>
                </g>
            </svg>
            
            <svg class="shuttlecock shuttlecock-2" viewBox="0 0 100 100">
                <g fill="none" stroke="#00d4ff" stroke-width="2">
                    <circle cx="50" cy="50" r="30"/>
                    <path d="M50 20 L50 80"/>
                    <path d="M20 50 L80 50"/>
                    <path d="M29 29 L71 71"/>
                    <path d="M71 29 L29 71"/>
                </g>
            </svg>
            
            <svg class="shuttlecock shuttlecock-3" viewBox="0 0 100 100">
                <g fill="none" stroke="#ff6b9d" stroke-width="2">
                    <circle cx="50" cy="50" r="30"/>
                    <path d="M50 20 L50 80"/>
                    <path d="M20 50 L80 50"/>
                    <path d="M29 29 L71 71"/>
                    <path d="M71 29 L29 71"/>
                </g>
            </svg>
            
            <!-- 标题部分 -->
            <div class="title-section">
                <h1 class="main-title">强势集团何总爱上羽毛球场的我</h1>
                <p class="subtitle">SHORT DRAMA SERIES</p>
            </div>
            
            <!-- 角色部分 -->
            <div class="characters-section">
                <div class="character-card male-character">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=600&fit=crop" alt="何总" class="character-image">
                    <div class="character-overlay">
                        <div class="character-name">何振宇</div>
                        <div class="character-role">霸道总裁 · 何总</div>
                    </div>
                </div>
                
                <div class="vs-symbol">×</div>
                
                <div class="character-card">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=600&fit=crop" alt="女主角" class="character-image">
                    <div class="character-overlay">
                        <div class="character-name">林小雨</div>
                        <div class="character-role">羽毛球少女</div>
                    </div>
                </div>
            </div>
            
            <!-- 标签部分 -->
            <div class="badges-section">
                <span class="badge">都市爱情</span>
                <span class="badge badge-blue">霸道总裁</span>
                <span class="badge">青春励志</span>
                <span class="badge badge-blue">甜宠虐恋</span>
            </div>
            
            <!-- 剧情简介 -->
            <div class="synopsis-section">
                <div class="synopsis-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff6b9d" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    剧情简介
                </div>
                <p class="synopsis-text">
                    强势集团的霸道总裁何振宇，在一次偶然的机会中，来到了一家羽毛球馆，遇到了正在训练的羽毛球少女林小雨。
                    一个是冷酷无情的商界帝王，一个是充满活力的运动少女，两个世界的碰撞，会擦出怎样的火花？
                    在羽毛球的陪伴下，一段甜宠而又充满挑战的爱情故事，就此展开...
                </p>
            </div>
            
            <!-- 观看按钮 -->
            <div class="cta-section">
                <button class="watch-btn" onclick="window.location.href='index.html'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    立即观看
                </button>
            </div>
            
            <!-- 页脚 -->
            <div class="footer">
                <p>© 2025 强势集团何总爱上羽毛球场的我 · 短剧出品</p>
            </div>
        </div>
    </div>
</body>
</html>
